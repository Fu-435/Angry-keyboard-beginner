<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>雨夜山庄 · 恐怖剧本杀</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 全局雷雨背景 -->
  <canvas id="rain-canvas"></canvas>
  <div id="lightning"></div>
  <div id="vignette"></div>

  <!-- 声音开关 -->
  <button id="sound-toggle" title="开关音效">🔊</button>

  <!-- 屏幕一：雷雨首屏 -->
  <div id="screen-rain" class="screen active">
    <h1 class="game-title">雨夜山庄</h1>
    <p class="subtitle">一场暴雨 · 一桩命案 · 凶手就在你们中间</p>
    <p class="tap-hint">—— 点击屏幕进入 ——</p>
  </div>

  <!-- 屏幕二：主菜单（选人数 + 创建/加入） -->
  <div id="screen-menu" class="screen">
    <div class="menu-card">
      <h1 class="menu-title">雨夜山庄</h1>
      <p class="menu-sub">暴雨封山，命案已生。欢迎来到这场……</p>

      <label class="field">
        <span>你的昵称</span>
        <input id="name-input" type="text" maxlength="12" placeholder="输入昵称">
      </label>

      <button class="btn btn-blood" id="btn-create-4">🌩 开一局 · 四人局</button>
      <button class="btn btn-blood" id="btn-create-6">🌩 开一局 · 六人局</button>

      <div class="divider"><span>或</span></div>

      <label class="field">
        <span>加入房间</span>
        <input id="room-input" type="text" maxlength="6" placeholder="输入 6 位房间号">
      </label>
      <button class="btn btn-ghost" id="btn-join">🔑 加入房间</button>
    </div>
  </div>

  <!-- 屏幕三：等待大厅 -->
  <div id="screen-lobby" class="screen">
    <div class="lobby-card">
      <h2 class="panel-title">等待大厅</h2>
      <div class="room-code-box">
        <div class="room-code-label">房间号</div>
        <div class="room-code" id="lobby-code">------</div>
        <button class="btn btn-ghost btn-small" id="btn-copy-link">复制邀请链接</button>
      </div>

      <h3 class="lobby-sub">已加入玩家（<span id="lobby-count">0</span>/<span id="lobby-max">4</span>）</h3>
      <ul id="lobby-players" class="player-list"></ul>

      <div id="lobby-hint" class="lobby-hint">等待房主开始游戏…</div>
      <button class="btn btn-blood" id="btn-start" style="display:none">🕯 开始游戏</button>
    </div>
  </div>

  <!-- 屏幕四：游戏主界面 -->
  <div id="screen-game" class="screen">
    <header id="game-header">
      <div class="phase-info">
        <span class="phase-label" id="phase-label">——</span>
        <div class="phase-dots" id="phase-dots"></div>
      </div>
      <button class="btn btn-blood btn-small" id="btn-next" style="display:none">进入下一环节 →</button>
    </header>

    <!-- 主持人漂浮文字 -->
    <div id="host-overlay" class="hidden">
      <div id="host-text"></div>
      <div class="host-dismiss">（点击继续）</div>
    </div>

    <main id="main-area"></main>

    <!-- 聊天面板 -->
    <aside id="chat-panel">
      <div class="chat-header">阴间的窃窃私语</div>
      <div id="chat-messages"></div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" maxlength="200" placeholder="说点什么…">
        <button id="chat-send">发送</button>
      </div>
    </aside>

    <!-- 底部工具栏 -->
    <div id="toolbar">
      <button class="tool-btn" id="btn-notepad">📓 记事本</button>
      <button class="tool-btn" id="btn-clues">🔍 线索</button>
      <button class="tool-btn" id="btn-roster">👥 角色</button>
      <button class="tool-btn" id="btn-script">📜 剧本</button>
    </div>
  </div>

  <!-- 记事本模态框 -->
  <div id="notepad-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span>📓 我的记事本</span>
        <button class="modal-close" data-close="notepad-modal">✕</button>
      </div>
      <textarea id="notepad-text" placeholder="在这里记录你的线索与推理…（仅你自己可见，自动保存）"></textarea>
    </div>
  </div>

  <!-- 详情模态框（线索 / 角色详情） -->
  <div id="detail-modal" class="modal hidden">
    <div class="modal-box">
      <div class="modal-header">
        <span id="detail-title">详情</span>
        <button class="modal-close" data-close="detail-modal">✕</button>
      </div>
      <div id="detail-body" class="modal-body"></div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
